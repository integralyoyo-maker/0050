name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  schedule:
    # UTC 時間（台北 = UTC+8）。刻意避開整點：GitHub 官方說明整點是高負載時段，排程可能延遲甚至被丟棄。
    - cron: '23 8 * * 1-5'    # 台北 16:23（收盤後）
    - cron: '47 9 * * 1-5'    # 台北 17:47，備援；若第一次沒跑到或失敗，這次補上
  workflow_dispatch:
    inputs:
      line_test:
        description: '送一則 LINE 測試訊息（確認通知設定）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    timeout-minutes: 15         # Yahoo 卡住時不要無限等
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data builder
        run: python build_data.py

      - name: Send LINE notifications
        continue-on-error: true   # 通知失敗不該害網站停止部署
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          if [ "${{ inputs.line_test }}" = "true" ]; then python notify.py --test; fi
          python notify.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true      # 偶爾出現「Found 0 artifacts」（GitHub 端暫時性），等一下再試一次
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # 放在部署之後：先前每次「資料有變動而在部署前 push」都會讓部署找不到 artifact
      - name: Commit and push if data changed
        if: always()
        continue-on-error: true   # 推送失敗不該害網站停止部署
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock data" && git pull --rebase -X theirs && git push)
