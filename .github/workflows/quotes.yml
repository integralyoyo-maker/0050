name: Update intraday quotes

on:
  schedule:
    - cron: '*/5 1-5 * * 1-5'   # UTC 01:00~05:55 = 台北 09:00~13:55，週一到週五，每 5 分鐘
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: true

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch quotes
        run: python quotes.py "$RUNNER_TEMP/quotes_out"
      - name: Publish to quotes branch (single commit, force-push)
        run: |
          cd "$RUNNER_TEMP/quotes_out"
          git init -q -b quotes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git commit -q -m "quotes $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" quotes
